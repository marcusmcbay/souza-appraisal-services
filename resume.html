<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Resumés and Credentials - Souza Appraisal Services
    </title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <div class="navbar">

            <div class="logo">
                Souza Appraisal Services
            </div>

            <nav>

                <ul>

                    <li>
                        <a href="index.html">Home</a>
                    </li>

                    <li>
                        <a href="ourteam.html">Our Team</a>
                    </li>

                    <li>
                        <a href="contact.html">Contact Us</a>
                    </li>

                    <li class="dropdown">

                        <button class="dropdown-button">
                            About Us ▼
                        </button>

                        <ul class="dropdown-menu">

                            <li>
                                <a href="resume.html">
                                    Resumés and Credentials
                                </a>
                            </li>

                            <li>
                                <a href="clsv.html">
                                    Client List and Service Area
                                </a>
                            </li>

                        </ul>

                    </li>

                </ul>

            </nav>

        </div>

    </header>

    <main class="page-content">

        <h1>
            Resumés and Credentials
        </h1>

        <!-- MARK -->

        <section class="resume-section">

            <h2>
                Mark Souza
            </h2>

            <a
                class="resume-download-button"
                href="docs/msouza.pdf"
                download
            >
                Download PDF
            </a>

            <iframe
                src="docs/msouza.pdf"
                width="100%"
                height="800"
                style="
                    border:1px solid #d6d6d6;
                    margin-top:20px;
                    background:white;
                "
            >
            </iframe>

        </section>

        <!-- MELODY -->

        <section class="resume-section">

            <h2>
                Melody Bold
            </h2>

            <a
                class="resume-download-button"
                href="docs/mbold.pdf"
                download
            >
                Download PDF
            </a>

            <iframe
                src="docs/mbold.pdf"
                width="100%"
                height="800"
                style="
                    border:1px solid #d6d6d6;
                    margin-top:20px;
                    background:white;
                "
            >
            </iframe>

        </section>

    </main>

    <script>

        const dropdownButton =
            document.querySelector(".dropdown-button");

        const dropdownMenu =
            document.querySelector(".dropdown-menu");

        dropdownButton.addEventListener("click", () => {

            dropdownMenu.classList.toggle("show");

        });

        window.addEventListener("click", (e) => {

            if (!e.target.matches(".dropdown-button")) {

                dropdownMenu.classList.remove("show");

            }

        });

    </script>

</body>

</html>
